<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>EngiFar | ホーム</title>
  <link rel="stylesheet" href="./style.css?v=20260824-multipage">
  <script src="./script.js?v=20260824-multipage" defer></script>
</head>
<body>
  <div class="app-shell" id="app" data-page="home" data-state="idle" data-phase="briefing">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="EngiFar ホーム">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M16 3c5 4 7 9 7 15l-3 6h-8l-3-6c0-6 2-11 7-15Z" />
            <circle cx="16" cy="13" r="3" />
            <path d="m10 18-5 5 7 1m10-6 5 5-7 1" />
          </svg>
        </span>
        <span class="brand-copy">
          <strong>EngiFar</strong>
          <small>WEB QUIZ FLIGHT SYSTEM</small>
        </span>
      </a>

      <div class="mission-state" role="status" aria-live="polite">
        <span class="state-light" aria-hidden="true"></span>
        <span>
          <small>24 QUESTION MISSION</small>
          <strong id="mission-status">STANDBY</strong>
        </span>
      </div>
    </header>

    <main class="cockpit">
      <aside class="mission-panel" aria-label="ホーム画面">
        <section class="mode-panel briefing-panel" id="briefing-panel">
          <div class="panel-heading">
            <p class="eyebrow"><span>01</span> MISSION BRIEFING</p>
            <h1>WEB QUIZ <br><em>ROCKET</em></h1>
            <p class="panel-description">Webの知識をエネルギーに変えて、自分だけのカラーのクルーと宇宙を目指そう。</p>
          </div>

          <div class="mission-facts" aria-label="ミッション内容">
            <div><strong>24</strong><span>QUESTIONS</span><small>全24問</small></div>
            <div><strong>06</strong><span>FIELDS</span><small>6分野</small></div>
            <div><strong>∞</strong><span>COLORS</span><small>自由カラー</small></div>
          </div>

          <div class="player-setup">
            <div class="player-setup-heading">
              <strong>PLAYER SETUP</strong>
              <small>名前とクルーカラーを決めよう</small>
            </div>

            <div class="player-identity-row">
              <img class="player-avatar-preview" id="player-avatar-preview" src="./assets/crew-green.svg" alt="選択中のカラーのクルー">
              <label class="profile-name-field" for="profile-name">
                <span>DISPLAY NAME <small>プレイヤー名</small></span>
                <input id="profile-name" type="text" maxlength="20" autocomplete="name" enterkeyhint="go" value="CREW MEMBER">
              </label>
            </div>

            <div class="color-picker" role="group" aria-labelledby="player-color-label">
              <span class="color-picker-label" id="player-color-label">PLAYER COLOR <small>自由選択</small></span>
              <label class="free-color-picker" for="player-color">
                <input class="player-color-input" id="player-color" type="color" value="#51d27b" aria-label="プレイヤーカラーを自由に選ぶ">
                <span class="free-color-picker__copy">
                  <output class="selected-color-code" id="selected-color-code" for="player-color">#51D27B</output>
                  <small>タップしてパレットを開く</small>
                </span>
              </label>
            </div>
          </div>

          <div class="threshold-hint briefing-hint">
            <span class="threshold-icon" aria-hidden="true">◇</span>
            <span><strong>軌道ライン</strong><small>出力60%以上・安全性75%以上</small></span>
          </div>

          <button class="launch-button" id="start-button" type="button">
            <span class="launch-button__icon" aria-hidden="true">&lt;/&gt;</span>
            <span><strong>クイズを始める</strong><small>START MISSION</small></span>
            <span class="launch-button__arrow" aria-hidden="true">→</span>
          </button>
        </section>
      </aside>
    </main>
  </div>
</body>
</html>
