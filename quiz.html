<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>EngiFar | クイズ</title>
  <link rel="stylesheet" href="./style.css?v=20260824-multipage">
  <script src="./script.js?v=20260824-multipage" defer></script>
</head>
<body>
  <div class="app-shell" id="app" data-page="quiz" data-state="quiz" data-phase="quiz">
    <main class="cockpit">
      <aside class="mission-panel" aria-label="クイズ・発射コントロール">
        <section class="mode-panel quiz-panel" id="quiz-panel" aria-live="polite">
          <div class="quiz-progress-head">
            <div>
              <p class="eyebrow">KNOWLEDGE CHARGE</p>
              <strong><span id="question-current">01</span><small> / 24</small></strong>
            </div>
            <span class="category-chip" id="question-category">フロントエンド</span>
          </div>

          <div class="quiz-progress"><i id="quiz-progress-bar"></i></div>

          <div class="question-meta">
            <span id="question-label">QUESTION 01</span>
            <div class="question-meta-tools">
              <span class="difficulty-chip" id="difficulty-chip">STANDARD</span>
              <span class="quiz-timer" id="quiz-timer" data-mode="answer" role="timer" aria-live="polite">
                <span id="quiz-timer-label">回答</span>
                <strong id="quiz-timer-value">10</strong><small>秒</small>
              </span>
            </div>
          </div>
          <p class="question-instruction" id="question-instruction">日本語の説明を読み、空欄に入る答えを選んでください。</p>
          <pre class="question-code" id="question-text">問題を読み込んでいます...</pre>
          <div class="quiz-answers" id="answers"></div>

          <div class="feedback-slot">
            <div class="quiz-feedback" id="feedback" hidden>
              <strong id="feedback-title">正解！</strong>
              <p id="feedback-text"></p>
            </div>
          </div>

          <button class="quiz-next-button is-countdown" id="next-button" type="button" disabled aria-live="polite">
            <span id="next-label">10秒間は回答を変更できます</span><b aria-hidden="true">●</b>
          </button>
        </section>
      </aside>
    </main>
  </div>
</body>
</html>
